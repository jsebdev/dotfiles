[project]
name = "mind-palace-practice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["questionary>=2.0"]

[project.scripts]
mind_palace_practice = "mind_palace_practice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mind_palace_practice", "mind_palaces"]
